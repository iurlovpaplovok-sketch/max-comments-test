<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Комментарии</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #f5f5f5;
            padding: 16px;
            padding-bottom: 32px;
        }
        .post-preview {
            background: white;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .post-preview h3 {
            font-size: 14px;
            color: #666;
            margin-bottom: 8px;
        }
        .post-preview p {
            font-size: 16px;
            color: #222;
            word-wrap: break-word;
        }
        .comments-list {
            margin-bottom: 20px;
        }
        .comment {
            background: white;
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 12px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.05);
        }
        .comment-author {
            font-weight: 600;
            font-size: 14px;
            color: #007aff;
            margin-bottom: 4px;
        }
        .comment-text {
            font-size: 15px;
            color: #333;
            word-wrap: break-word;
        }
        .comment-time {
            font-size: 11px;
            color: #999;
            margin-top: 6px;
        }
        .comment-form {
            background: white;
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            resize: vertical;
            font-family: inherit;
            box-sizing: border-box;
        }
        button {
            background: #007aff;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            margin-top: 12px;
            width: 100%;
            cursor: pointer;
        }
        button:active { background: #0056b3; }
        .empty {
            text-align: center;
            color: #999;
            padding: 32px;
        }
        .status {
            margin-top: 12px;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            text-align: center;
        }
        .status.success {
            background: #d4edda;
            color: #155724;
        }
        .status.error {
            background: #f8d7da;
            color: #721c24;
        }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="post-preview">
        <h3>📌 Пост</h3>
        <p id="postText">Загрузка...</p>
    </div>

    <div class="comments-list" id="commentsList">
        <div class="empty">💬 Комментариев пока нет</div>
    </div>

    <div class="comment-form">
        <textarea id="commentInput" rows="3" placeholder="Напишите комментарий..."></textarea>
        <button id="sendBtn">✉️ Отправить комментарий</button>
        <div id="status" class="hidden"></div>
    </div>

    <script>
        let currentPostId = null;
        let currentChannelId = null;

        // Получаем данные из URL
        const urlParams = new URLSearchParams(window.location.search);
        const encodedData = urlParams.get('data');
        
        if (encodedData) {
            try {
                const data = JSON.parse(decodeURIComponent(encodedData));
                currentPostId = data.post_id;
                currentChannelId = data.channel_id;
                document.getElementById('postText').innerText = data.post_text || 'Пост без текста';
            } catch(e) {
                document.getElementById('postText').innerText = 'Ошибка загрузки данных поста';
                console.error(e);
            }
        } else {
            document.getElementById('postText').innerText = 'Данные поста не переданы (тестовый режим)';
        }

        // Функция отправки комментария
        async function sendComment() {
            const text = document.getElementById('commentInput').value.trim();
            const statusDiv = document.getElementById('status');
            
            if (!text) {
                showStatus('❌ Напишите комментарий', 'error');
                return;
            }
            
            if (!currentPostId) {
                showStatus('❌ Ошибка: не идентифицирован пост', 'error');
                return;
            }
            
            // Формируем данные для отправки
            const commentData = {
                post_id: currentPostId,
                channel_id: currentChannelId,
                comment: text
            };
            
            // Отправляем данные через MAX WebApp API
            if (window.TelegramWebApp) {
                window.TelegramWebApp.sendData(JSON.stringify(commentData));
                showStatus('✅ Комментарий отправляется...', 'success');
                setTimeout(() => window.TelegramWebApp.close(), 1000);
            } else {
                showStatus('⚠️ Работает только внутри MAX. Данные: ' + JSON.stringify(commentData), 'error');
                console.log('Mock send:', commentData);
            }
        }
        
        function showStatus(message, type) {
            const statusDiv = document.getElementById('status');
            statusDiv.textContent = message;
            statusDiv.className = `status ${type}`;
            setTimeout(() => {
                statusDiv.className = 'hidden';
            }, 3000);
        }

        document.getElementById('sendBtn').onclick = sendComment;
        
        // Отправка по Ctrl+Enter
        document.getElementById('commentInput').addEventListener('keypress', (e) => {
            if (e.ctrlKey && e.key === 'Enter') sendComment();
        });
    </script>
</body>
</html>
